services:
  app:
    build: .
    container_name: workorder-app
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - app-storage:/var/www/html/storage/app/public
      - app-logs:/var/www/html/storage/logs
    environment:
         - DB_HOST=db
          - DB_PORT=5432
         - DB_DATABASE=workorder_db
         - DB_USERNAME=workorder
         - DB_PASSWORD=${DB_PASSWORD:-secret}
      - APP_ENV=production
      - APP_DEBUG=false
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
      - SESSION_DRIVER=database
    depends_on:
      db:
        condition: service_healthy

 db:
    image: postgres:16-alpine
   container_name: workorder-db
   restart: unless-stopped
   environment:
      - POSTGRES_DB=workorder_db
      - POSTGRES_USER=workorder
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secret}
   volumes:
      - db-data:/var/lib/postgresql/data
   healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workorder -d workorder_db"]
     interval: 10s
     timeout: 5s
     retries: 5

volumes:
  app-storage:
  app-logs:
  db-data:
